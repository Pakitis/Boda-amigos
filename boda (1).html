<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nuestra Boda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500;1,600&family=Jost:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f3a2e;
    --ivory:#faf6ef;
    --gold:#b08d57;
    --rose:#c97b84;
    --charcoal:#2b2b28;
    --line:rgba(31,58,46,0.14);
    --card:#ffffff;
    --danger:#a4453b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ivory);
    color:var(--charcoal);
    font-family:'Jost',sans-serif;
    min-height:100vh;
    overscroll-behavior-y:none;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:var(--ivory);
  }
  ::selection{background:var(--rose);color:#fff;}

  /* ---------- Login ---------- */
  .login-screen{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 28px;
    text-align:center;
    background:
      radial-gradient(circle at 50% 0%, rgba(176,141,87,0.12), transparent 60%),
      var(--ink);
    color:var(--ivory);
    min-height:100vh;
  }
  .monogram{
    width:86px;height:86px;border-radius:50%;
    border:1px solid rgba(250,246,239,0.5);
    display:flex;align-items:center;justify-content:center;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;font-weight:600;font-size:30px;
    letter-spacing:1px;
    margin-bottom:22px;
  }
  .login-screen h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;font-style:italic;
    font-size:38px;margin:0 0 6px;line-height:1.1;
  }
  .login-screen .sub{
    font-size:12px;letter-spacing:3px;text-transform:uppercase;
    color:var(--gold);margin-bottom:34px;
  }
  .field{
    width:100%;text-align:left;margin-bottom:14px;
  }
  .field label{
    display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
    color:rgba(250,246,239,0.6);margin-bottom:6px;
  }
  .field input{
    width:100%;padding:13px 14px;border-radius:2px;
    border:1px solid rgba(250,246,239,0.28);
    background:rgba(250,246,239,0.06);
    color:var(--ivory);font-family:'Jost',sans-serif;font-size:15px;
    outline:none;
  }
  .field input:focus{border-color:var(--gold);}
  .field input::placeholder{color:rgba(250,246,239,0.35);}
  .btn{
    width:100%;padding:14px;border:none;border-radius:2px;
    font-family:'Jost',sans-serif;font-size:13px;letter-spacing:2px;text-transform:uppercase;
    cursor:pointer;
  }
  .btn-primary{
    background:var(--gold);color:var(--ink);font-weight:600;margin-top:8px;
  }
  .btn-primary:active{opacity:0.85;}
  .btn-ghost{
    background:transparent;border:1px solid rgba(250,246,239,0.3);color:var(--ivory);
  }
  .login-error{
    color:var(--rose);font-size:13px;margin-top:12px;min-height:16px;
  }
  .login-hint{
    margin-top:26px;font-size:11px;color:rgba(250,246,239,0.45);line-height:1.6;
  }

  /* ---------- App shell ---------- */
  .topbar{
    padding:18px 20px 14px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);
    background:var(--ivory);
    position:sticky;top:0;z-index:5;
  }
  .topbar .who{font-size:12px;color:var(--gold);letter-spacing:1px;}
  .topbar .who b{color:var(--ink);}
  .logout{
    background:none;border:none;font-family:'Jost',sans-serif;font-size:11px;
    letter-spacing:1.5px;text-transform:uppercase;color:var(--charcoal);
    opacity:0.55;cursor:pointer;padding:6px;
  }
  .content{
    flex:1;
    padding:24px 20px 100px;
  }
  .divider{
    width:34px;height:1px;background:var(--gold);margin:6px auto 22px;
  }
  .divider.left{margin:6px 0 22px;}

  /* bottom nav */
  .tabbar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;
    display:flex;
    background:var(--card);
    border-top:1px solid var(--line);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index:10;
  }
  .tab{
    flex:1;background:none;border:none;display:flex;flex-direction:column;
    align-items:center;gap:4px;padding:6px 2px;cursor:pointer;
    color:rgba(43,43,40,0.4);
  }
  .tab.active{color:var(--ink);}
  .tab .ic{width:20px;height:20px;}
  .tab span{font-size:10px;letter-spacing:0.5px;text-transform:uppercase;}

  /* ---------- Home / countdown ---------- */
  .names{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
    font-size:34px;text-align:center;line-height:1.15;color:var(--ink);
  }
  .datestr{
    text-align:center;font-size:12px;letter-spacing:2px;text-transform:uppercase;
    color:var(--gold);margin-top:8px;
  }
  .ticket{
    margin-top:26px;background:var(--card);
    border-radius:4px;
    box-shadow:0 10px 30px rgba(31,58,46,0.08);
    position:relative;
    overflow:hidden;
    padding:26px 18px 20px;
  }
  .ticket:before,.ticket:after{
    content:"";position:absolute;top:50%;transform:translateY(-50%);
    width:20px;height:20px;background:var(--ivory);border-radius:50%;
  }
  .ticket:before{left:-10px;}
  .ticket:after{right:-10px;}
  .ticket .row{
    display:flex;justify-content:center;gap:14px;
  }
  .count-block{text-align:center;min-width:56px;}
  .count-num{
    font-family:'Space Mono',monospace;font-weight:700;font-size:30px;color:var(--ink);
  }
  .count-lbl{
    font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--rose);margin-top:4px;
  }
  .perf{
    border-top:1px dashed var(--line);margin:20px -18px 0;padding-top:14px;
    text-align:center;font-size:12px;color:var(--charcoal);opacity:0.7;
  }
  .info-list{margin-top:30px;display:flex;flex-direction:column;gap:16px;}
  .info-item{
    display:flex;gap:14px;align-items:flex-start;
    padding-bottom:16px;border-bottom:1px solid var(--line);
  }
  .info-ic{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--gold);
  }
  .info-txt .t{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);}
  .info-txt .d{font-family:'Cormorant Garamond',serif;font-size:19px;margin-top:2px;color:var(--ink);}

  /* section headers */
  .sec-h{text-align:center;margin-bottom:6px;}
  .sec-h .eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);}
  .sec-h h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:28px;margin:4px 0 0;color:var(--ink);}

  /* ---------- Photos ---------- */
  .upload-box{
    border:1px dashed var(--gold);border-radius:4px;
    padding:22px;text-align:center;color:var(--gold);
    font-size:12px;letter-spacing:1px;text-transform:uppercase;
    margin-bottom:22px;cursor:pointer;background:rgba(176,141,87,0.05);
  }
  .grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
  }
  .ph{
    position:relative;border-radius:4px;overflow:hidden;aspect-ratio:1/1;
    background:#eee;
  }
  .ph img{width:100%;height:100%;object-fit:cover;display:block;}
  .ph .tag{
    position:absolute;left:0;right:0;bottom:0;
    background:linear-gradient(transparent,rgba(0,0,0,0.55));
    color:#fff;font-size:10px;padding:14px 8px 6px;letter-spacing:0.5px;
  }
  .ph .del{
    position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;
    background:rgba(31,58,46,0.75);color:#fff;border:none;font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .empty{
    text-align:center;color:rgba(43,43,40,0.45);font-size:13px;padding:40px 10px;
  }

  /* ---------- Menu ---------- */
  .menu-opt{
    display:flex;align-items:center;gap:12px;
    padding:16px;border:1px solid var(--line);border-radius:4px;margin-bottom:10px;
    cursor:pointer;background:var(--card);
  }
  .menu-opt.sel{border-color:var(--gold);background:rgba(176,141,87,0.08);}
  .menu-opt .dot{
    width:16px;height:16px;border-radius:50%;border:1px solid var(--gold);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .menu-opt.sel .dot:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);}
  .menu-opt .txt{font-size:15px;}
  .save-note{
    text-align:center;font-size:12px;color:var(--gold);margin-top:14px;min-height:16px;
  }
  .resp-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;
  }
  .resp-row .n{color:var(--ink);}
  .resp-row .c{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);}
  .subhead{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--charcoal);opacity:0.5;margin:26px 0 10px;}

  /* ---------- Admin / users ---------- */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:4px;
    padding:18px;margin-bottom:14px;
  }
  .card h3{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;margin:0 0 12px;color:var(--ink);
  }
  .u-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 0;border-bottom:1px solid var(--line);
  }
  .u-row:last-child{border-bottom:none;}
  .u-name{font-size:14px;color:var(--charcoal);}
  .u-name b{display:block;font-size:14.5px;color:var(--ink);}
  .u-name small{color:rgba(43,43,40,0.5);}
  .u-del{
    background:none;border:none;color:var(--danger);font-size:11px;letter-spacing:1px;
    text-transform:uppercase;cursor:pointer;padding:6px;
  }
  .plain-input{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:2px;
    font-family:'Jost',sans-serif;font-size:14px;margin-bottom:10px;background:#fff;color:var(--charcoal);
  }
  .row2{display:flex;gap:10px;}
  .row2 > *{flex:1;}
  .btn-small{
    padding:11px;font-size:12px;letter-spacing:1.5px;
  }
  .badge-admin{
    font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#fff;
    background:var(--gold);padding:2px 6px;border-radius:2px;margin-left:6px;
  }
  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--ivory);font-size:13px;
    padding:10px 18px;border-radius:20px;z-index:50;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
    max-width:88%;text-align:center;
  }
  .menu-editor-item{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .menu-editor-item input{flex:1;}
  .x-btn{background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer;padding:4px 8px;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){
  var state = {
    user: null,          // {username,name,isAdmin}
    users: [],
    config: null,
    photos: [],           // [{id,dataUrl,uploadedBy,uploadedByName,ts}]
    choices: {},           // username -> {choice,name}
    tab: 'inicio',
    toastMsg: null,
    toastTimer: null,
    localMode: (typeof window.storage === 'undefined' || !window.storage)
  };

  var DEFAULT_CONFIG = {
    coupleNames: 'Ana & Marc',
    weddingDate: '2026-10-17T17:00:00',
    venueName: 'Finca El Roure',
    venueAddr: 'Camí de la Serra, 12 · Barcelona',
    dressCode: 'Elegante · tonos tierra',
    menuOptions: ['Carne', 'Pescado', 'Vegetariano']
  };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  // Resilient storage: uses the artifact's persistent window.storage when available,
  // and silently falls back to an in-memory store (session only) otherwise, so the
  // app always loads instead of getting stuck if that API is missing or fails.
  var memStore = {};
  var persistentStorageOK = true;
  var storageBackend = {
    async get(key, shared){
      if(typeof window.storage !== 'undefined' && window.storage){
        try{ return await storageBackend.get(key, shared); }
        catch(e){ /* key not found or backend unavailable */ }
      }
      return memStore.hasOwnProperty(key) ? {key:key, value:memStore[key], shared:shared} : null;
    },
    async set(key, value, shared){
      if(typeof window.storage !== 'undefined' && window.storage){
        try{
          var r = await storageBackend.set(key, value, shared);
          if(r) return r;
        }catch(e){ persistentStorageOK = false; }
      }
      memStore[key] = value;
      return {key:key, value:value, shared:shared};
    },
    async delete(key, shared){
      if(typeof window.storage !== 'undefined' && window.storage){
        try{ var r = await storageBackend.delete(key, shared); if(r) return r; }
        catch(e){ /* ignore */ }
      }
      delete memStore[key];
      return {key:key, deleted:true, shared:shared};
    }
  };

  function showToast(msg){
    state.toastMsg = msg;
    render();
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(function(){ state.toastMsg = null; render(); }, 2200);
  }

  async function loadAll(){
    try{
      var u = await storageBackend.get('users', true);
      state.users = u ? JSON.parse(u.value) : [];
    }catch(e){ state.users = []; }

    if(state.users.length === 0){
      state.users = [{username:'admin', password:'boda2026', name:'Administrador/a', isAdmin:true}];
      await storageBackend.set('users', JSON.stringify(state.users), true);
    }

    try{
      var c = await storageBackend.get('config', true);
      state.config = c ? JSON.parse(c.value) : DEFAULT_CONFIG;
    }catch(e){
      state.config = DEFAULT_CONFIG;
      await storageBackend.set('config', JSON.stringify(DEFAULT_CONFIG), true);
    }

    try{
      var idx = await storageBackend.get('photo-index', true);
      var ids = idx ? JSON.parse(idx.value) : [];
      var photos = [];
      for(var i=0;i<ids.length;i++){
        try{
          var p = await storageBackend.get('photo:' + ids[i], true);
          if(p) photos.push(JSON.parse(p.value));
        }catch(e){}
      }
      photos.sort(function(a,b){ return b.ts - a.ts; });
      state.photos = photos;
    }catch(e){ state.photos = []; }

    try{
      var ch = await storageBackend.get('menu-choices', true);
      state.choices = ch ? JSON.parse(ch.value) : {};
    }catch(e){ state.choices = {}; }
  }

  async function saveUsers(){ await storageBackend.set('users', JSON.stringify(state.users), true); }
  async function saveConfig(){ await storageBackend.set('config', JSON.stringify(state.config), true); }
  async function saveChoices(){ await storageBackend.set('menu-choices', JSON.stringify(state.choices), true); }

  // ---------- countdown ----------
  function getCountdown(){
    var target = new Date(state.config.weddingDate).getTime();
    var now = Date.now();
    var diff = Math.max(0, target - now);
    var d = Math.floor(diff / 86400000);
    var h = Math.floor((diff % 86400000) / 3600000);
    var m = Math.floor((diff % 3600000) / 60000);
    var s = Math.floor((diff % 60000) / 1000);
    return {d:d,h:h,m:m,s:s, past: target - now < 0};
  }

  // ---------- image handling ----------
  function resizeImage(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var maxW = 1000;
          var scale = Math.min(1, maxW / img.width);
          var w = Math.round(img.width * scale);
          var h = Math.round(img.height * scale);
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function handleUpload(files){
    for(var i=0;i<files.length;i++){
      try{
        var dataUrl = await resizeImage(files[i]);
        var id = uid();
        var record = {id:id, dataUrl:dataUrl, uploadedBy:state.user.username, uploadedByName:state.user.name, ts:Date.now()};
        await storageBackend.set('photo:' + id, JSON.stringify(record), true);
        var idxRes = await storageBackend.get('photo-index', true);
        var ids = idxRes ? JSON.parse(idxRes.value) : [];
        ids.push(id);
        await storageBackend.set('photo-index', JSON.stringify(ids), true);
        state.photos.unshift(record);
      }catch(e){
        showToast('No se pudo subir una foto.');
      }
    }
    render();
  }

  async function deletePhoto(id){
    state.photos = state.photos.filter(function(p){ return p.id !== id; });
    render();
    try{
      await storageBackend.delete('photo:' + id, true);
      var idxRes = await storageBackend.get('photo-index', true);
      var ids = idxRes ? JSON.parse(idxRes.value) : [];
      ids = ids.filter(function(x){ return x !== id; });
      await storageBackend.set('photo-index', JSON.stringify(ids), true);
    }catch(e){}
  }

  // ---------- render ----------
  var root = document.getElementById('app');

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function fmtDate(iso){
    var d = new Date(iso);
    var opts = {day:'numeric', month:'long', year:'numeric'};
    var str = d.toLocaleDateString('es-ES', opts);
    var time = d.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
    return str.charAt(0).toUpperCase() + str.slice(1) + ' · ' + time + 'h';
  }

  function render(){
    if(!state.user){
      renderLogin();
    } else {
      renderApp();
    }
  }

  function renderLogin(){
    root.innerHTML =
    '<div class="login-screen">'+
      '<div class="monogram" id="mono"></div>'+
      '<h1>'+esc(state.config ? state.config.coupleNames : 'Nuestra Boda')+'</h1>'+
      '<div class="sub">Acceso de invitados</div>'+
      '<div style="width:100%">'+
        '<div class="field"><label>Usuario</label><input id="li-user" placeholder="tu usuario" autocomplete="username"></div>'+
        '<div class="field"><label>Contraseña</label><input id="li-pass" type="password" placeholder="••••••••" autocomplete="current-password"></div>'+
      '</div>'+
      '<button class="btn btn-primary" id="li-btn">Entrar</button>'+
      '<div class="login-error" id="li-err"></div>'+
      '<div class="login-hint">Si no tienes acceso, pide tus datos a la persona<br>encargada de organizar la boda.</div>'+
    '</div>';

    var names = (state.config ? state.config.coupleNames : 'A & M').split('&').map(function(s){return s.trim().charAt(0);}).join('');
    document.getElementById('mono').textContent = names || 'AB';

    var doLogin = async function(){
      var u = document.getElementById('li-user').value.trim().toLowerCase();
      var p = document.getElementById('li-pass').value;
      var err = document.getElementById('li-err');
      var match = state.users.find(function(x){ return x.username.toLowerCase() === u && x.password === p; });
      if(!match){
        err.textContent = 'Usuario o contraseña incorrectos.';
        return;
      }
      err.textContent = '';
      state.user = match;
      state.tab = 'inicio';
      render();
    };
    document.getElementById('li-btn').onclick = doLogin;
    document.getElementById('li-pass').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  }

  function renderApp(){
    var html = '<div class="topbar">'+
        '<div class="who">Hola, <b>'+esc(state.user.name)+'</b>'+(state.user.isAdmin?' <span class="badge-admin">Admin</span>':'')+'</div>'+
        '<button class="logout" id="logout-btn">Salir</button>'+
      '</div>'+
      (state.localMode ? '<div style="background:#f4e4c1;color:#5c4419;font-size:11.5px;text-align:center;padding:8px 16px;line-height:1.5;">Modo local: los cambios solo se guardan en este dispositivo y no se comparten con otros invitados.</div>' : '')+
      '<div class="content" id="content"></div>'+
      '<div class="tabbar">'+
        tabBtn('inicio','Inicio')+
        tabBtn('fotos','Fotos')+
        tabBtn('menu','Menú')+
        (state.user.isAdmin ? tabBtn('admin','Ajustes') : '')+
      '</div>'+
      (state.toastMsg ? '<div class="toast">'+esc(state.toastMsg)+'</div>' : '');

    root.innerHTML = html;
    document.getElementById('logout-btn').onclick = function(){ state.user = null; render(); };
    document.querySelectorAll('.tab').forEach(function(b){
      b.onclick = function(){ state.tab = b.dataset.tab; render(); };
    });

    var content = document.getElementById('content');
    if(state.tab === 'inicio') renderInicio(content);
    else if(state.tab === 'fotos') renderFotos(content);
    else if(state.tab === 'menu') renderMenu(content);
    else if(state.tab === 'admin') renderAdmin(content);
  }

  function tabBtn(id,label){
    var active = state.tab === id;
    var icons = {
      inicio: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 11.5 12 4l9 7.5M5.5 10v9.5h13V10"/></svg>',
      fotos: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="1.5"/><circle cx="9" cy="10.5" r="1.7"/><path d="m4 18 5-5 3.5 3.5L17 12l3 3"/></svg>',
      menu: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3v18M6 3c-1.5 0-2.5 1.3-2.5 4S4.5 11 6 11M18 3v7a2.5 2.5 0 0 1-5 0V3m2.5 0v18"/></svg>',
      admin: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1-3.5 4-5.5 7-5.5s6 2 7 5.5"/></svg>'
    };
    return '<button class="tab'+(active?' active':'')+'" data-tab="'+id+'">'+icons[id]+'<span>'+label+'</span></button>';
  }

  function renderInicio(el){
    var c = state.config;
    var cd = getCountdown();
    el.innerHTML =
      '<div class="names">'+esc(c.coupleNames)+'</div>'+
      '<div class="datestr">'+esc(fmtDate(c.weddingDate))+'</div>'+
      '<div class="ticket">'+
        (cd.past ?
          '<div style="text-align:center;font-family:\'Cormorant Garamond\',serif;font-style:italic;font-size:20px;color:var(--ink);">¡Ya nos casamos!</div>'
        :
          '<div class="row">'+
            countBlock(cd.d,'días')+countBlock(cd.h,'horas')+countBlock(cd.m,'min')+countBlock(cd.s,'seg')+
          '</div>'
        )+
        '<div class="perf">Faltan para el gran día</div>'+
      '</div>'+
      '<div class="info-list">'+
        infoItem('pin','Lugar', esc(c.venueName)+'<br><span style="font-size:14px;opacity:.65">'+esc(c.venueAddr)+'</span>')+
        infoItem('shirt','Código de vestimenta', esc(c.dressCode))+
      '</div>';
  }

  function countBlock(n,l){
    var s = n < 10 ? '0'+n : ''+n;
    return '<div class="count-block"><div class="count-num">'+s+'</div><div class="count-lbl">'+l+'</div></div>';
  }
  function infoItem(icon,title,desc){
    var icons = {
      pin:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="9" r="2.3"/></svg>',
      shirt:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 4 4 7l2 3 2-1v11h8V9l2 1 2-3-4-3-2 2h-2L8 4Z"/></svg>'
    };
    return '<div class="info-item"><div class="info-ic">'+icons[icon]+'</div><div class="info-txt"><div class="t">'+title+'</div><div class="d">'+desc+'</div></div></div>';
  }

  function renderFotos(el){
    var canDelete = function(p){ return state.user.isAdmin || p.uploadedBy === state.user.username; };
    el.innerHTML =
      '<div class="sec-h"><div class="eyebrow">Recuerdos</div><h2>Nuestras fotos</h2></div>'+
      '<div class="divider"></div>'+
      '<div class="upload-box" id="upload-box">＋ Subir foto</div>'+
      '<input type="file" id="file-input" accept="image/*" multiple style="display:none">'+
      (state.photos.length === 0 ?
        '<div class="empty">Aún no hay fotos.<br>Sé la primera persona en compartir un recuerdo.</div>' :
        '<div class="grid">'+ state.photos.map(function(p){
          return '<div class="ph"><img src="'+p.dataUrl+'" loading="lazy">'+
            (canDelete(p) ? '<button class="del" data-id="'+p.id+'">✕</button>' : '')+
            '<div class="tag">'+esc(p.uploadedByName)+'</div></div>';
        }).join('') + '</div>'
      );

    document.getElementById('upload-box').onclick = function(){ document.getElementById('file-input').click(); };
    document.getElementById('file-input').onchange = function(e){
      if(e.target.files.length) handleUpload(e.target.files);
      e.target.value = '';
    };
    el.querySelectorAll('.del').forEach(function(b){
      b.onclick = function(){ deletePhoto(b.dataset.id); };
    });
  }

  function renderMenu(el){
    var mine = state.choices[state.user.username];
    var html = '<div class="sec-h"><div class="eyebrow">Banquete</div><h2>Elige tu menú</h2></div><div class="divider"></div>';
    html += state.config.menuOptions.map(function(opt){
      var sel = mine && mine.choice === opt;
      return '<div class="menu-opt'+(sel?' sel':'')+'" data-opt="'+esc(opt)+'"><div class="dot"></div><div class="txt">'+esc(opt)+'</div></div>';
    }).join('');
    html += '<div class="save-note" id="save-note">'+(mine ? 'Elección guardada: '+esc(mine.choice) : 'Selecciona una opción para guardar tu elección')+'</div>';

    if(state.user.isAdmin){
      html += '<div class="subhead">Respuestas de invitados</div>';
      var answered = Object.keys(state.choices);
      if(answered.length === 0){
        html += '<div class="empty">Todavía nadie ha elegido su menú.</div>';
      } else {
        html += answered.map(function(u){
          var c = state.choices[u];
          return '<div class="resp-row"><span class="n">'+esc(c.name)+'</span><span class="c">'+esc(c.choice)+'</span></div>';
        }).join('');
      }
    }

    el.innerHTML = html;
    el.querySelectorAll('.menu-opt').forEach(function(b){
      b.onclick = async function(){
        var opt = b.dataset.opt;
        state.choices[state.user.username] = {choice:opt, name:state.user.name};
        await saveChoices();
        render();
      };
    });
  }

  function renderAdmin(el){
    var c = state.config;
    var html = '<div class="sec-h"><div class="eyebrow">Panel</div><h2>Ajustes</h2></div><div class="divider"></div>';

    html += '<div class="card"><h3>Detalles de la boda</h3>'+
      '<label style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold)">Nombres</label>'+
      '<input class="plain-input" id="cfg-names" value="'+esc(c.coupleNames)+'">'+
      '<label style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold)">Fecha y hora</label>'+
      '<input class="plain-input" id="cfg-date" type="datetime-local" value="'+toLocalInput(c.weddingDate)+'">'+
      '<label style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold)">Lugar</label>'+
      '<input class="plain-input" id="cfg-venue" value="'+esc(c.venueName)+'">'+
      '<label style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold)">Dirección</label>'+
      '<input class="plain-input" id="cfg-addr" value="'+esc(c.venueAddr)+'">'+
      '<label style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold)">Código de vestimenta</label>'+
      '<input class="plain-input" id="cfg-dress" value="'+esc(c.dressCode)+'">'+
      '<button class="btn btn-primary btn-small" id="cfg-save">Guardar cambios</button>'+
    '</div>';

    html += '<div class="card"><h3>Opciones de menú</h3><div id="menu-editor">'+
      c.menuOptions.map(function(opt,i){
        return '<div class="menu-editor-item"><input class="plain-input" style="margin-bottom:0" data-i="'+i+'" value="'+esc(opt)+'"><button class="x-btn" data-rm="'+i+'">×</button></div>';
      }).join('')+
      '</div>'+
      '<button class="btn btn-ghost btn-small" id="menu-add" style="color:var(--ink);border-color:var(--line);margin-bottom:8px">＋ Añadir opción</button>'+
      '<button class="btn btn-primary btn-small" id="menu-save">Guardar opciones</button>'+
    '</div>';

    html += '<div class="card"><h3>Invitados con acceso</h3>'+
      state.users.map(function(u){
        return '<div class="u-row"><div class="u-name"><b>'+esc(u.name)+(u.isAdmin?' <span class="badge-admin">Admin</span>':'')+'</b><small>usuario: '+esc(u.username)+'</small></div>'+
          (u.username !== state.user.username ? '<button class="u-del" data-u="'+esc(u.username)+'">Eliminar</button>' : '')+
        '</div>';
      }).join('')+
    '</div>';

    html += '<div class="card"><h3>Añadir invitado</h3>'+
      '<input class="plain-input" id="nu-name" placeholder="Nombre visible">'+
      '<div class="row2">'+
        '<input class="plain-input" id="nu-user" placeholder="usuario">'+
        '<input class="plain-input" id="nu-pass" placeholder="contraseña">'+
      '</div>'+
      '<button class="btn btn-primary btn-small" id="nu-add">Crear acceso</button>'+
    '</div>';

    el.innerHTML = html;

    document.getElementById('cfg-save').onclick = async function(){
      c.coupleNames = document.getElementById('cfg-names').value.trim() || c.coupleNames;
      var dv = document.getElementById('cfg-date').value;
      if(dv) c.weddingDate = new Date(dv).toISOString();
      c.venueName = document.getElementById('cfg-venue').value.trim();
      c.venueAddr = document.getElementById('cfg-addr').value.trim();
      c.dressCode = document.getElementById('cfg-dress').value.trim();
      await saveConfig();
      showToast('Detalles guardados.');
    };

    document.getElementById('menu-add').onclick = function(){
      c.menuOptions.push('Nueva opción');
      renderAdmin(el);
    };
    el.querySelectorAll('[data-rm]').forEach(function(b){
      b.onclick = function(){
        c.menuOptions.splice(parseInt(b.dataset.rm),1);
        renderAdmin(el);
      };
    });
    document.getElementById('menu-save').onclick = async function(){
      var inputs = el.querySelectorAll('#menu-editor input');
      var opts = [];
      inputs.forEach(function(inp){ if(inp.value.trim()) opts.push(inp.value.trim()); });
      c.menuOptions = opts.length ? opts : DEFAULT_CONFIG.menuOptions.slice();
      await saveConfig();
      showToast('Opciones de menú guardadas.');
      renderAdmin(el);
    };

    el.querySelectorAll('.u-del').forEach(function(b){
      b.onclick = async function(){
        var uname = b.dataset.u;
        state.users = state.users.filter(function(u){ return u.username !== uname; });
        await saveUsers();
        showToast('Acceso eliminado.');
        renderAdmin(el);
      };
    });

    document.getElementById('nu-add').onclick = async function(){
      var name = document.getElementById('nu-name').value.trim();
      var user = document.getElementById('nu-user').value.trim().toLowerCase();
      var pass = document.getElementById('nu-pass').value;
      if(!name || !user || !pass){ showToast('Rellena los tres campos.'); return; }
      if(state.users.some(function(u){ return u.username.toLowerCase() === user; })){
        showToast('Ese usuario ya existe.'); return;
      }
      state.users.push({username:user, password:pass, name:name, isAdmin:false});
      await saveUsers();
      showToast('Invitado añadido: '+name);
      renderAdmin(el);
    };
  }

  function toLocalInput(iso){
    var d = new Date(iso);
    var pad = function(n){ return (n<10?'0':'')+n; };
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
  }

  // ---------- boot ----------
  root.innerHTML = '<div class="login-screen"><div class="sub">Cargando…</div></div>';

  async function boot(){
    try{
      await loadAll();
    }catch(e){
      console.error('Error al cargar datos:', e);
    }
    // Guarantee sane defaults no matter what happened above
    if(!state.config) state.config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    if(!state.users || state.users.length === 0){
      state.users = [{username:'admin', password:'boda2026', name:'Administrador/a', isAdmin:true}];
    }
    if(!state.photos) state.photos = [];
    if(!state.choices) state.choices = {};

    render();
    setInterval(function(){
      if(state.user && state.tab === 'inicio'){
        var c = document.getElementById('content');
        if(c) renderInicio(c);
      }
    }, 1000);
  }

  boot();
})();
</script>
</body>
</html>
